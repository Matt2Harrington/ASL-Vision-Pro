# XcodeGen spec — generates ASLVisionPro.xcodeproj from these sources.
# Install: brew install xcodegen   Then run: xcodegen generate
#
# Two app targets share the platform-agnostic pipeline in ASLVisionPro/Shared:
#   • ASLVisionPro      — visionOS, enterprise main-camera passthrough
#   • ASLVisionPro-iOS  — iOS, iPhone camera (backup, no special entitlement)

# Bundle identifiers use com.example so nothing is tied to one developer account. Change the
# prefix below to your own reverse-DNS before running on a physical device — free provisioning
# registers the identifier against your team, so a shared prefix collides between people.

name: ASLVisionPro
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    visionOS: "2.0"
    iOS: "17.0"

targets:
  # ---- visionOS app ---------------------------------------------------------
  ASLVisionPro:
    type: application
    platform: visionOS
    sources:
      - path: ASLVisionPro/Shared
        excludes: ["Resources/**", "Models/**"]
      # Optional: the trained model is gitignored (a synthetic placeholder would
      # mislead). Without it the app falls back to the stub recognizer by design.
      - path: ASLVisionPro/Shared/Models
        optional: true
      - path: ASLVisionPro/Shared/Resources
        buildPhase: resources
      - path: ASLVisionPro/visionOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ASLVisionPro
        INFOPLIST_FILE: ASLVisionPro/visionOS/Support/Info.plist
        # DEV DEFAULT: no-camera entitlements so device builds work while Apple's
        # main-camera-access "Request Access" is pending. AFTER APPROVAL, switch this to
        #   ASLVisionPro/visionOS/Support/ASLVisionPro.entitlements
        # and re-run `xcodegen generate`.
        CODE_SIGN_ENTITLEMENTS: ASLVisionPro/visionOS/Support/ASLVisionPro-NoCamera.entitlements
        SWIFT_VERSION: "5.10"
        GENERATE_INFOPLIST_FILE: NO
        # No team is set on purpose, so this builds for anyone with no configuration.
        # Simulator builds need none. For a physical device, pick your own team in Xcode:
        # target > Signing & Capabilities > Team. A free Apple ID works.
        CODE_SIGN_STYLE: Automatic

  # ---- Unit tests (shared pipeline logic) -----------------------------------
  ASLVisionProTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: ASLVisionPro/Shared
        excludes: ["Resources/**", "Models/**"]
      # Optional: the trained model is gitignored (a synthetic placeholder would
      # mislead). Without it the app falls back to the stub recognizer by design.
      - path: ASLVisionPro/Shared/Models
        optional: true
      - path: ASLVisionPro/Shared/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ASLVisionPro.Tests
        SWIFT_VERSION: "5.10"
        GENERATE_INFOPLIST_FILE: YES

  # ---- iOS app (backup) -----------------------------------------------------
  ASLVisionPro-iOS:
    type: application
    platform: iOS
    sources:
      - path: ASLVisionPro/Shared
        excludes: ["Resources/**", "Models/**"]
      # Optional: the trained model is gitignored (a synthetic placeholder would
      # mislead). Without it the app falls back to the stub recognizer by design.
      - path: ASLVisionPro/Shared/Models
        optional: true
      - path: ASLVisionPro/Shared/Resources
        buildPhase: resources
      - path: ASLVisionPro/iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ASLVisionPro.iOS
        INFOPLIST_FILE: ASLVisionPro/iOS/Support/Info.plist
        SWIFT_VERSION: "5.10"
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad
        # No team is set on purpose, so this builds for anyone with no configuration.
        # Simulator builds need none. For a physical device, pick your own team in Xcode:
        # target > Signing & Capabilities > Team. A free Apple ID works.
        CODE_SIGN_STYLE: Automatic
